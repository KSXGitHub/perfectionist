name: Check JS Types

# Type-checks the docs-site browser scripts (tools/gen-docs/src/*.js) from
# their JSDoc annotations with the TypeScript compiler, by running the
# justfile's `check-js-types` recipe (`tsc --noEmit`, driven by
# tsconfig.json) — the same command a contributor runs locally.
#
# This workflow is intentionally independent of every other CI:
#
#   * It is a standalone workflow with its own job, not a `needs:` dependency
#     of the Test or Pages workflows and not invoked via `workflow_call`, so it
#     can never gate them — a red run here leaves Test and the Pages deploy
#     free to pass and publish.
#   * It installs no Rust toolchain — only Node tooling (pnpm + the pinned
#     TypeScript) and a prebuilt `just` binary — so it shares no cache or
#     step with the Rust suite.
#
# An allow-list of trigger paths keeps it from running on unrelated changes.
# The `justfile` is one of them because the recipe run below lives there, so
# editing the recipe re-runs the check it drives. Because this workflow gates
# nothing, a path missed here only means a JS/JSDoc change went unchecked by
# CI — never a blocked merge or a broken deploy.
on:
  push:
    branches: ['**']
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tsconfig.json'
      - 'justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js-types.yaml'
  pull_request:
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tsconfig.json'
      - 'justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js-types.yaml'
  workflow_dispatch:

# Type-checking only reads the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check JS types

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-tscheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-tscheck-${{ runner.os }}-

      # The recipe installs the pinned packages
      # (`pnpm install --frozen-lockfile`) before invoking `tsc`, so it
      # covers both halves of the check and CI keeps no second copy of the
      # commands to drift from.
      - name: Type-check JavaScript
        shell: bash
        run: just check-js-types
