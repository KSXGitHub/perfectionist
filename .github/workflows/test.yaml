name: Test

on:
  - push
  - pull_request

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          # `target/integration-fixtures{,-warmup}/` hold the
          # warmup's incremental-compilation state. rustc ICEs when
          # any input to the lint-registration fingerprint (e.g. a
          # rule's `default_level`) changes against a cache
          # populated under the previous value, so the dirs are
          # excluded; the expensive plugin build still lives in the
          # main `target/` cache.
          #
          # `.dev-tools/` holds `cargo-dylint` and `dylint-link`
          # installed by `just install-dev-tools` at the version
          # pinned in Cargo.lock; caching it skips the from-source
          # `cargo install` on subsequent runs with the same lockfile.
          path: |
            ~/.cargo
            ~/.dylint_drivers
            target
            .dev-tools
            !target/integration-fixtures
            !target/integration-fixtures-warmup
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-

      - name: Install Rust
        shell: bash
        run: |
          installer=$(mktemp -d)/install-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > $installer
          bash $installer --default-toolchain none -y
          source "$HOME/.cargo/env"
          # Triggers rustup to install the toolchain and components from the
          # rust-toolchain override file (TOML format is required for `components`).
          rustup show active-toolchain || rustup show

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # `cargo-dylint` and `dylint-link` are pinned to the workspace's
      # `dylint_linting` version via `just install-dev-tools`, which
      # writes them under `.dev-tools/`. That dir is in the cache, so
      # this step is a no-op on a cache hit.
      - name: Install dylint tooling
        shell: bash
        run: just install-dev-tools

      - name: Fmt
        shell: bash
        run: just fmt

      - name: Build
        shell: bash
        run: just build

      - name: Doc
        shell: bash
        run: just doc

      - name: Lint
        shell: bash
        run: just lint

      - name: Test
        shell: bash
        run: just test

      - name: Self-lint
        shell: bash
        run: just self-lint

      - name: Clean workspace artifacts before cache
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clean --workspace
