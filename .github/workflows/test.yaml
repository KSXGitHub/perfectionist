name: Test

on:
  - push
  - pull_request

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          # `target/integration-fixtures{,-warmup}/` hold the
          # warmup's incremental-compilation state. rustc ICEs when
          # any input to the lint-registration fingerprint (e.g. a
          # rule's `default_level`) changes against a cache
          # populated under the previous value, so the dirs are
          # excluded; the expensive plugin build still lives in the
          # main `target/` cache.
          path: |
            ~/.cargo
            ~/.dylint_drivers
            target
            !target/integration-fixtures
            !target/integration-fixtures-warmup
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-

      - name: Install Rust
        shell: bash
        run: |
          installer=$(mktemp -d)/install-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > $installer
          bash $installer --default-toolchain none -y
          source "$HOME/.cargo/env"
          # Triggers rustup to install the toolchain and components from the
          # rust-toolchain override file (TOML format is required for `components`).
          rustup show active-toolchain || rustup show

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # `.dev-tools/` only changes when `dylint_linting` is bumped, so
      # cache it under a key tied to that version rather than to the
      # whole `Cargo.lock`. Most lockfile churn (unrelated dep bumps)
      # leaves this cache valid and skips the from-source rebuild of
      # cargo-dylint and dylint-link. The version is read by the same
      # workspace crate that performs the install, so there is one
      # source of truth and no shell-side `Cargo.lock` parsing.
      - name: Read pinned dylint version
        id: dylint-version
        shell: bash
        run: just gha-dylint-version

      - name: Cache .dev-tools
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: .dev-tools
          key: dev-tools-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ steps.dylint-version.outputs.version }}

      - name: Install dylint tooling
        shell: bash
        run: just install-dev-tools

      - name: Fmt
        shell: bash
        run: just fmt

      - name: Build
        shell: bash
        run: just build --locked

      - name: Doc
        shell: bash
        run: just doc --locked

      - name: Lint
        shell: bash
        run: just lint --locked

      - name: Test
        shell: bash
        run: just test --locked

      - name: Self-lint
        shell: bash
        run: just self-lint --locked

      - name: Clean workspace artifacts before cache
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clean --workspace
