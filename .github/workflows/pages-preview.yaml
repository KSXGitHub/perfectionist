name: Pages preview

on:
  # Mirror the production Pages deploy's path filter (see pages.yaml): a
  # preview is only worth building when the PR changes something the
  # rendered site is derived from (rule sources under `src/`, the
  # gen-docs renderer + assets, `Cargo.toml`) or a build input (lockfile,
  # toolchain, linker config in `.cargo/`, the `justfile` minify recipe,
  # the pinned minifier dependencies in `package.json` / `pnpm-lock.yaml`).
  # PRs that only touch `planned-rules/`, the generated
  # `rules/` markdown mirror, or `README.md` don't change the page, so
  # they skip the Cloudflare deploy.
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tools/gen-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - '.cargo/**'
      - 'justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages-preview.yaml'

permissions:
  contents: read

# One in-flight preview build per PR. Newer pushes supersede older
# ones; the deploy itself is fast enough that overlap is rare, but
# cancelling avoids racing two `wrangler pages deploy` calls.
concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest

    # Skip PRs that won't have access to repository secrets:
    #   * Fork PRs — GitHub withholds secrets from workflow runs
    #     triggered by forks, so CLOUDFLARE_API_TOKEN resolves to
    #     an empty string.
    #   * Dependabot PRs — even though Dependabot pushes its
    #     branches to this repo (so the fork check above passes),
    #     `pull_request` runs for Dependabot use a restricted
    #     security context that hides secrets by default for the
    #     same authentication-failure reason.
    # A skipped job shows as neutral on the PR rather than as a
    # confusing red X that external contributors (or Dependabot)
    # can't act on.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'

    # Scopes CLOUDFLARE_API_TOKEN to this job. The deployment also
    # shows up under the repo's Environments tab so each preview is
    # tracked alongside production.
    environment:
      name: cloudflare-preview
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # Check out the PR head commit (not the auto-generated merge
      # ref) so the rendered docs reflect exactly the code under
      # review and the "Source:" permalinks resolve to a SHA that
      # exists on GitHub.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Cache
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: |
            ~/.cargo
            target
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-

      - name: Install Rust
        shell: bash
        run: |
          installer=$(mktemp -d)/install-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > $installer
          bash $installer --default-toolchain none -y
          source "$HOME/.cargo/env"
          rustup show active-toolchain || rustup show

      - name: Install dylint-link
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: dylint-link

      - name: Install just
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: just

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-minify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-minify-${{ runner.os }}-

      # Pass the PR head SHA as `--git-ref` so the rendered
      # "Source:" links permalink the exact commit being previewed
      # rather than `master` (which `gen-docs` defaults to but
      # which isn't checked out here).
      - name: Render site
        shell: bash
        run: cargo run --package _gen_docs --bin gen-docs -- --root "$(pwd)" html gh-pages --git-ref="${{ github.event.pull_request.head.sha }}"

      - name: Minify site
        shell: bash
        run: just minify-docs gh-pages

      # Wrangler's `--branch` flag drives the alias subdomain
      # Cloudflare assigns to the deployment
      # (<branch-slug>.perfectionist-preview.pages.dev). Using the
      # PR's head ref keeps that URL stable across pushes to the
      # same PR; the per-commit hash URL stays unique per deploy.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy gh-pages --project-name=perfectionist-preview --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Clean workspace artifacts before cache
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clean --workspace
