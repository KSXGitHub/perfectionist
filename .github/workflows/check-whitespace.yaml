name: Check Whitespace

# Runs `just check-whitespace`, which rejects any tracked file that
# carries trailing whitespace, ends with a blank line, or is missing its
# final newline.
#
# Deliberately unfiltered: unlike the Test workflow, this one has no
# `paths-ignore` deny-list. The check reads every tracked file, so a
# push that touches only documentation is exactly the push that can
# reintroduce the whitespace this guards against.
#
# It installs no toolchain beyond `just` itself — the recipe is git and
# awk — so it gates nothing else and shares no cache with the Rust
# suite.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The check only reads the repository.
permissions:
  contents: read

jobs:
  check:
    name: Check whitespace

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check whitespace
        shell: bash
        run: just check-whitespace
