name: Deploy

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run the full test suite (`just all`) against the tagged commit
  # before anything is published. `publish` requires this job to pass.
  # The called workflow itself further restricts the token to
  # `contents: read`; this declaration makes the limit visible to
  # static analysers (CodeQL etc.) inspecting deploy.yaml directly.
  test:
    name: Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yaml

  publish:
    name: Publish to crates.io

    needs: test

    runs-on: ubuntu-latest

    environment:
      name: crates-io
      url: https://crates.io/crates/perfectionist

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The version-bump-contract check needs the tagged commit's
          # parent to diff against, so fetch one extra commit beyond
          # the default shallow clone.
          fetch-depth: 2

      - name: Cache
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: |
            ~/.cargo
            ~/.dylint_drivers
            target
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-

      - name: Install Rust
        shell: bash
        run: |
          installer=$(mktemp -d)/install-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > $installer
          bash $installer --default-toolchain none -y
          source "$HOME/.cargo/env"
          # Triggers rustup to install the toolchain and components from the
          # rust-toolchain override file (TOML format is required for `components`).
          rustup show active-toolchain || rustup show

      - name: Install Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: dylint-link

      # Encapsulates the release contract:
      #   * tag matches `X.Y.Z` or `X.Y.Z-<suffix>`
      #   * commit message at HEAD equals the tag exactly
      #   * Cargo.toml `[package].version` equals the tag
      #   * Cargo.lock `perfectionist` version equals the tag
      #   * the diff against the parent touches only the two `version`
      #     lines in Cargo.toml and Cargo.lock — nothing else
      # See `tools/deploy-check/`.
      #
      # The tag is read via `env:` rather than interpolated directly
      # into the shell, so a tag whose name contained shell
      # metacharacters (`$(...)`, backticks, etc.) cannot be expanded.
      - name: Verify version-bump contract
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cargo run --locked --package _deploy_check --bin deploy-check -- \
            "$(pwd)" verify "$TAG_NAME"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Clean workspace artifacts before cache
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clean --workspace
