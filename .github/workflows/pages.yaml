name: Pages

on:
  # Only rebuild + redeploy the public catalogue when an input to the
  # rendered site actually changes. gen-docs reads the rule sources
  # under `src/`, its own renderer + assets under `tools/gen-docs/`, and
  # `Cargo.toml` (crate version + repo URL); the build additionally
  # depends on the pinned toolchain, the lockfile, and the linker config
  # in `.cargo/`, and the post-render minify pass on the `justfile`
  # recipe plus the pinned minifier dependencies (`package.json` /
  # `pnpm-lock.yaml`). Pure docs that never reach the page —
  # `planned-rules/`, the generated `rules/` markdown mirror, `README.md`
  # — are excluded. An allow-list fits a deploy workflow: a path missed
  # here just leaves the live site untouched (the previous deploy
  # stands), never broken. `workflow_dispatch` stays available for manual
  # redeploys regardless of which paths changed.
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tools/gen-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain'
      - '.cargo/**'
      - 'justfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A single in-flight deploy at a time. Don't cancel running deploys
# because GitHub Pages rejects overlapping uploads.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: |
            ~/.cargo
            target
          key: ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
            ${{ github.job }}-${{ runner.os }}-${{ hashFiles('rust-toolchain') }}-

      - name: Install Rust
        shell: bash
        run: |
          installer=$(mktemp -d)/install-rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > $installer
          bash $installer --default-toolchain none -y
          source "$HOME/.cargo/env"
          # Triggers rustup to install the toolchain and components from the
          # rust-toolchain override file (TOML format is required for `components`).
          rustup show active-toolchain || rustup show

      - name: Install dylint-link
        uses: taiki-e/install-action@v2
        with:
          tool: dylint-link

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install pnpm
        # No `version` input: action-setup reads it from the
        # `packageManager` field in the root `package.json`.
        uses: pnpm/action-setup@v4

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-minify-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-minify-${{ runner.os }}-

      - name: Render site
        shell: bash
        run: cargo run --package _gen_docs --bin gen-docs -- --root "$(pwd)" html gh-pages

      - name: Minify site
        shell: bash
        run: just minify-docs gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages

      - name: Clean workspace artifacts before cache
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clean --workspace

  deploy:
    name: Deploy to GitHub Pages

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
