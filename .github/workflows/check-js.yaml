name: Check JS

on:
  push:
    branches: ['**']
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  pull_request:
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Check JS formatting

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-jsfmt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-jsfmt-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      # The file list comes from git rather than from a directory walk, so
      # the set CI checks is exactly the set `just fmt-js` checks and
      # neither can quietly drift from the other.
      #
      # `--check` is not the default: a bare `oxfmt` rewrites the files it
      # is given, which in CI would pass while reporting nothing.
      - name: Check JS formatting
        shell: bash
        run: |
          git ls-files '*.js' '*.mjs' | tr '\n' '\0' \
            | xargs -0 pnpm exec oxfmt --check

  lint:
    name: Lint JS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-jslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-jslint-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      # Same file list as the formatting job, for the same reason.
      #
      # `--type-aware` runs the rules that need to know a type, which on
      # this tree is most of what oxlint has to offer: the scripts carry
      # their types in JSDoc, so a scope-only pass barely sees them. The
      # types come from `tsconfig.json`, and the `types` job reports an
      # error in those first.
      - name: Lint JavaScript
        shell: bash
        run: |
          git ls-files '*.js' '*.mjs' | tr '\n' '\0' \
            | xargs -0 pnpm exec oxlint --type-aware

  types:
    name: Check JS types

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-tscheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-tscheck-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Type-check JavaScript
        shell: bash
        run: pnpm exec tsc --noEmit --project tsconfig.json

  test:
    name: Test JS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run JS unit tests
        shell: bash
        run: node tools/gen-docs/tests/run.mjs
