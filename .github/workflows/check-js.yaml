name: Check JS

# Checks the docs-site browser scripts, in the two ways they can be checked
# without a browser:
#
#   * `types` type-checks tools/gen-docs/src/*.js and the test files beside
#     them from their JSDoc annotations with the TypeScript compiler
#     (`tsc --noEmit`, driven by tsconfig.json).
#   * `test` runs the unit tests in tools/gen-docs/tests/ under `node:test`.
#     It installs nothing: the runner is built into Node.
#
# This workflow is intentionally independent of every other CI:
#
#   * It is a standalone workflow with its own jobs, not a `needs:`
#     dependency of the Test or Pages workflows and not invoked via
#     `workflow_call`, so it can never gate them — a red run here leaves Test
#     and the Pages deploy free to pass and publish.
#   * It only installs Node tooling, never the Rust toolchain, so it shares
#     no cache or step with the Rust suite.
#
# The two jobs are independent of each other for the same reason: a type
# error should not hide a failing test, nor the reverse.
#
# An allow-list of trigger paths keeps it from running on unrelated changes.
# Because it gates nothing, a path missed here only means a JS/JSDoc change
# went unchecked by CI — never a blocked merge or a broken deploy.
on:
  push:
    branches: ['**']
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  pull_request:
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  workflow_dispatch:

# Neither job writes to the repository.
permissions:
  contents: read

jobs:
  types:
    name: Check JS types

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-tscheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-tscheck-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Type-check JavaScript
        shell: bash
        run: pnpm exec tsc --noEmit --project tsconfig.json

  test:
    name: Test JS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Pinned rather than left to the runner image's default, so the
      # version the tests run under changes when this file says so and not
      # when the image is rebuilt.
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run JS unit tests
        shell: bash
        run: node tools/gen-docs/tests/run.mjs
