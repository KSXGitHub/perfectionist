name: Check JS

on:
  push:
    branches: ['**']
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  pull_request:
    paths:
      - 'tools/gen-docs/src/*.js'
      - 'tools/gen-docs/tests/**'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/check-js.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: Check JS formatting

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-jsfmt-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-jsfmt-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      # `--check` is not the default: a bare `oxfmt` rewrites what it is
      # given, which in CI would pass while reporting nothing. The globs
      # are not decoration either -- oxfmt formats YAML, JSON and
      # markdown too, and this tree holds files of each whose exact bytes
      # are a fixture.
      - name: Check JS formatting
        shell: bash
        run: pnpm exec oxfmt --check '**/*.js' '**/*.mjs'

  lint:
    name: Lint JS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-jslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-jslint-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      # Without `--type-aware` the rules that read these scripts' JSDoc
      # types do not run, which is most of what oxlint has to offer here.
      - name: Lint JavaScript
        shell: bash
        run: pnpm exec oxlint --type-aware

  types:
    name: Check JS types

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        timeout-minutes: 1
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-tscheck-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-tscheck-${{ runner.os }}-

      - name: Install packages
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Type-check JavaScript
        shell: bash
        run: pnpm exec tsc --noEmit --project tsconfig.json

  test:
    name: Test JS

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run JS unit tests
        shell: bash
        run: node tools/gen-docs/tests/run.mjs
