[workspace]
members = ["tools/*", "utils"]

[package]
name = "perfectionist"
description = "Additional linting rules for Rust projects"
version = "0.0.0-rc.22"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://KSXGitHub.github.io/perfectionist/"
repository = "https://github.com/KSXGitHub/perfectionist.git"
keywords = [
  "lint",
  "dylint",
]
categories = [
  "development-tools",
  "rust-patterns",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[lib]
crate-type = ["cdylib"]

[lints.rust]
# `dylint_lib` is set by the dylint driver when it loads this library;
# declare it so a plain `cargo check` doesn't warn about the
# `cfg(dylint_lib = "perfectionist")` gates in `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("perfectionist"))'] }

[lints.clippy]
alloc_instead_of_core = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
mod_module_files = "warn"
std_instead_of_core = "warn"

[dependencies]
clippy_utils = "=0.1.99"
dylint_linting = "6.0.4"
serde = { version = "1.0.228", features = ["derive"] }
unicode-width = "0.2.2"

[dev-dependencies]
_utils = { path = "utils" }
command-extra = "1.0.0"
dylint_testing = "6.0.4"
pipe-trait = "0.4.0"
text-block-macros = "0.2.0"
toml = "1.1.2"

[package.metadata.rust-analyzer]
rustc_private = true

# The `cdylib` this crate builds carries the debuginfo of everything
# linked into it, and the dylint driver `dlopen`s that library once per
# UI-test fixture — so the library's size is paid ~200 times over a
# `cargo test` run. Full debuginfo makes it 136 MB and costs ~0.8s per
# fixture; line tables alone make it 24 MB and cost ~0.14s, while
# keeping the file and line numbers a backtrace needs.
#
# `split-debuginfo = "unpacked"` reaches the same speed while retaining
# full debuginfo, but is not supported on Windows-MSVC, so it is left
# to whoever wants it in a local `.cargo/config.toml`.
[profile.dev]
debug = "line-tables-only"
