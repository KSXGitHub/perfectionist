[workspace]
members = ["tools/*", "utils"]

[package]
name = "perfectionist"
description = "Additional linting rules for Rust projects"
version = "0.0.0-rc.22"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://KSXGitHub.github.io/perfectionist/"
repository = "https://github.com/KSXGitHub/perfectionist.git"
keywords = [
  "lint",
  "dylint",
]
categories = [
  "development-tools",
  "rust-patterns",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[lib]
crate-type = ["cdylib"]

[lints.rust]
# `dylint_lib` is set by the dylint driver when it loads this library;
# declare it so a plain `cargo check` doesn't warn about the
# `cfg(dylint_lib = "perfectionist")` gates in `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("perfectionist"))'] }

[lints.clippy]
alloc_instead_of_core = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
mod_module_files = "warn"
std_instead_of_core = "warn"

[dependencies]
clippy_utils = "=0.1.99"
dylint_linting = "6.0.4"
serde = { version = "1.0.228", features = ["derive"] }
unicode-width = "0.2.2"

[dev-dependencies]
_utils = { path = "utils" }
command-extra = "1.0.0"
dylint_testing = "6.0.4"
pipe-trait = "0.4.0"
text-block-macros = "0.2.0"
toml = "1.1.2"

[package.metadata.rust-analyzer]
rustc_private = true

# The dylint driver hashes each lint library to decide whether rustc may
# reuse its incremental cache, and it does so by reading the file whole —
# every byte, on every rustc invocation, which during a `cargo test` run
# means once per UI-test fixture. So what the library costs is its size.
#
# `debug = false` drops the debuginfo that made up most of it (136 MB ->
# 10 MB); `opt-level = 3` shrinks the generated code the rest of the way
# (-> 3.6 MB), and together they take the suite from ~117s to ~19s. A
# panic still reports its own `file:line` (that comes from
# `#[track_caller]`, not debuginfo) and a backtrace still names every
# frame; only the `at <file>:<line>` under each frame is lost, which
# matters to a debugger this project does not use.
#
# Both settings are scoped rather than set on `[profile.dev]` as a whole.
# Only this crate and the dependencies linked into its `cdylib` affect
# that file; the tools, `utils`, and the test binaries do not, and
# optimizing them buys nothing while making every rebuild of them several
# times slower.
[profile.dev.package.perfectionist]
debug = false
opt-level = 3

[profile.dev.package."*"]
debug = false
opt-level = 3
