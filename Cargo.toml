[package]
name = "perfectionist"
description = "Additional linting rules for Rust projects"
version = "0.0.0"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/perfectionist"
repository = "https://github.com/KSXGitHub/perfectionist.git"
keywords = [
  "lint",
  "dylint",
]
categories = [
  "development-tools",
  "rust-patterns",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = "=0.1.92"
dylint_linting = "5.0.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "5.0.0"

[package.metadata.rust-analyzer]
rustc_private = true

[package.metadata.dylint]
libraries = [
  { path = "." },
]
