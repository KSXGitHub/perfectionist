[workspace]
members = ["tools/*", "utils"]

[package]
name = "perfectionist"
description = "Additional linting rules for Rust projects"
version = "0.0.0-rc.22"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://KSXGitHub.github.io/perfectionist/"
repository = "https://github.com/KSXGitHub/perfectionist.git"
keywords = [
  "lint",
  "dylint",
]
categories = [
  "development-tools",
  "rust-patterns",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[lib]
crate-type = ["cdylib"]

[lints.rust]
# `dylint_lib` is set by the dylint driver when it loads this library;
# declare it so a plain `cargo check` doesn't warn about the
# `cfg(dylint_lib = "perfectionist")` gates in `src/lib.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values("perfectionist"))'] }

[lints.clippy]
alloc_instead_of_core = "warn"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
mod_module_files = "warn"
std_instead_of_core = "warn"

[dependencies]
clippy_utils = "=0.1.99"
dylint_linting = "6.0.4"
serde = { version = "1.0.228", features = ["derive"] }
unicode-width = "0.2.2"

[dev-dependencies]
_utils = { path = "utils" }
command-extra = "1.0.0"
dylint_testing = "6.0.4"
pipe-trait = "0.4.0"
text-block-macros = "0.2.0"
toml = "1.1.2"

[package.metadata.rust-analyzer]
rustc_private = true

# The dylint driver reads this crate's `cdylib` in full — a single
# `read` of every byte, on top of `dlopen` — once per UI-test fixture,
# so the library's size is paid a few hundred times over a `cargo test`
# run. Two knobs shrink it, together taking the library from 136 MB to
# under 4 MB and the suite from ~117s to ~19s:
#
# `debug = false` drops the debuginfo that made up most of those bytes.
# A panic still reports its own `file:line` (that comes from
# `#[track_caller]`, not debuginfo) and a backtrace still names every
# frame; only the `at <file>:<line>` under each frame is lost, which
# matters to a debugger this project does not use.
#
# `opt-level = 3` then shrinks the generated code itself. It does not
# cost rebuild time here: with no debuginfo to emit, an incremental
# rebuild of this crate comes out slightly ahead of an unoptimized one.
[profile.dev]
debug = false
opt-level = 3
