[workspace]
members = ["tools/*", "utils"]

[package]
name = "perfectionist"
description = "Additional linting rules for Rust projects"
version = "0.0.0-rc.4"
authors = ["khai96_ <hvksmr1996@gmail.com>"]
edition = "2024"
readme = "README.md"
license = "MIT"
documentation = "https://docs.rs/perfectionist"
repository = "https://github.com/KSXGitHub/perfectionist.git"
keywords = [
  "lint",
  "dylint",
]
categories = [
  "development-tools",
  "rust-patterns",
]
include = [
  "/src",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE.md",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
clippy_utils = "=0.1.96"
dylint_linting = "5.0.0"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
_utils = { path = "utils" }
dylint_testing = "5.0.0"

[package.metadata.rust-analyzer]
rustc_private = true
