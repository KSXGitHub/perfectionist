[package]
name = "_utils"
description = "Internal test-support helpers for perfectionist's integration tests"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "warmup"
path = "cli/warmup.rs"

[lints]
workspace = true

[dependencies]
build-fs-tree = "0.8.1"
cargo_toml = "0.22.3"
clap = { version = "4.6.1", features = ["derive"] }
command-extra = "1.2.0"
derive_more = { version = "2.1.1", default-features = false, features = ["display"] }
diff = "0.1.13"
dylint_testing = "6.1.0"
pipe-trait = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
toml = "1.1.2"

[dev-dependencies]
text-block-macros = "0.2.0"
