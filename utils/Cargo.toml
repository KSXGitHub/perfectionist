[package]
name = "_utils"
description = "Internal helpers for perfectionist's integration tests and docs site"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "warmup"
path = "cli/warmup.rs"

[[bin]]
name = "gen-docs"
path = "cli/gen-docs.rs"

[dependencies]
build-fs-tree = "0.8.1"
cargo_toml = "0.22.3"
clap = { version = "4.6.1", features = ["derive"] }
command-extra = "1.0.0"
pipe-trait = "0.4.0"
proc-macro2 = "1.0.95"
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html"] }
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.105", features = ["full", "parsing", "extra-traits"] }
tempfile = "3.27.0"
toml = "1.1.2"
