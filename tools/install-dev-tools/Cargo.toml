[package]
name = "_install_dev_tools"
description = "Installs cargo-dylint and dylint-link into target/dev-tools/ at the version this workspace pins in Cargo.lock"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "install-dev-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
