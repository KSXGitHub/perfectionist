[package]
name = "_dev_tools"
description = "Manages cargo-dylint and dylint-link under .dev-tools/, pinned to the dylint version this workspace resolves in Cargo.lock"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "dev-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
command-extra = "1.0.0"
pipe-trait = "0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
