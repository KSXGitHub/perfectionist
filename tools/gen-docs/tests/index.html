<!doctype html>
<!--
  The browser runner for the tests in this directory. Open it straight from
  the checkout — `file://.../tools/gen-docs/tests/index.html` — in whatever
  engine you want to hold the libraries to; there is nothing to build and
  nothing to serve. `just test-js` runs the same cases headlessly.

  It is deliberately not part of the generated site. The scripts are loaded
  out of `../src/`, where the page's real ones live, so what runs here is
  the shipped file rather than a copy of it, and `gh-pages/` gains nothing.

  The script order is the one the catalogue's own page uses: the libraries,
  then the harness, then the cases that register against it, then the
  reporter that runs them. `run.mjs` loads the same files in the same order
  and checks that every case file here has a tag below.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>perfectionist docs-site JS tests</title>
    <style>
      body {
        margin: 2rem auto;
        max-width: 60rem;
        padding: 0 1rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      #summary {
        font-weight: 700;
      }
      #summary:empty::before {
        content: "the reporter did not run";
        font-weight: 400;
        font-style: italic;
      }
      #cases {
        list-style: none;
        padding: 0;
      }
      #cases li {
        border-left: 0.25rem solid currentcolor;
        margin: 0.5rem 0;
        padding: 0 0 0 0.75rem;
      }
      .pass {
        color: #0a7d32;
      }
      .fail {
        color: #b3261e;
      }
      .name {
        display: block;
        color: CanvasText;
      }
      .why {
        display: block;
        font-family: ui-monospace, monospace;
        font-size: 0.875em;
      }
    </style>
  </head>
  <body>
    <h1>docs-site JS tests</h1>
    <p id="summary"></p>
    <ul id="cases"></ul>

    <script src="../src/match.js"></script>
    <script src="../src/rank.js"></script>
    <script src="harness.js"></script>
    <script src="match.test.js"></script>
    <script src="rank.test.js"></script>
    <script src="report.js"></script>
  </body>
</html>
