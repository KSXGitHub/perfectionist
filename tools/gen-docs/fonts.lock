# Webfont the HTML catalogue links, pinned for a reproducible, verifiable
# download. gen-docs fetches it on a cache miss (see src/fonts.rs), checks
# it against the SHA-256 here, and reuses the local cache on later runs so
# the build works offline once warm. The binary is deliberately not
# committed to this repository; it is hosted in the sibling
# KSXGitHub/perfectionist-binary-assets repo and downloaded from there.
#
# Format, one font per line: <sha256>  <filename>  <url>
# The <filename> is what the file is written as beside index.html, and
# must match the name base.css references in `url(...)`.
# Lines that are blank or start with `#` are ignored.
#
# Cantarell — the variable font (one `wght` axis serves both the body's
# regular and the headings' bold). SIL OFL 1.1; the license rides along
# as src/assets/Cantarell-OFL.txt.

257cafd9c63c0c29f77b357eb4143f574149ac45e26596c3db9997451a64fbb0  cantarell.otf  https://raw.githubusercontent.com/KSXGitHub/perfectionist-binary-assets/master/Cantarell/0.303/Cantarell-VF.otf
