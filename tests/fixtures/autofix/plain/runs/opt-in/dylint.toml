[perfectionist]
enable = ["core_instead_of_std", "import_grouping_mismatch", "uncombined_self_import", "unordered_derives"]

# Under the default `either` style the rule accepts any wrapped form
# and offers one `MaybeIncorrect` suggestion per form, so naming a
# style is what gives it an autofix to test.
["perfectionist::bare_email"]
style = "angle_brackets"

# Enabling this rule without naming a layout is a fatal config error.
["perfectionist::import_grouping_mismatch"]
style = "multi_block"
reexports = "grouped"
