[workspace.metadata.dylint]
libraries = [
  { path = "." },
]

# `import_grouping_mismatch` is inactive by default, so it must be enabled here
# for the self-lint to keep enforcing this crate's import layout.
[perfectionist]
enable = ["import_grouping_mismatch"]

["perfectionist::unicode_ellipsis_in_docs"]
scan_code_spans = true

# This crate keeps every module's `use` statements in one contiguous
# block with no blank lines between them, with `pub` re-exports pulled
# into two leading blocks — submodule re-exports above alias re-exports.
# Under `single_block` the `order` and group-classification knobs are
# ignored.
["perfectionist::import_grouping_mismatch"]
style = "single_block"
reexports = "split"

# `tools/gen-docs` parses `declare_tool_lint!` bodies with syn, whose
# `Token![::]` macro takes a token literal in type position — there is no
# runtime expression for the surrounding macro to drop or duplicate, so the
# exactly-once concern the rule guards against does not apply.
["perfectionist::impure_macro_arguments"]
ignore = ["Token"]

# The markdown and URL scanners predate `excessive_cognitive_complexity`
# and several of them score far above its default of 15. This ceiling
# sits just above the highest of them so no new function may join them;
# lower it as they are split.
["perfectionist::excessive_cognitive_complexity"]
max_complexity = 47

# Several existing bodies bind more names than the default. This
# ceiling sits just above the widest of them so no new body may join
# them; lower it as they are split.
["perfectionist::too_many_local_bindings"]
max_bindings = 29

# The same ratchet for `overly_long_function`: the longest existing body
# has 97 lines of code; lower the ceiling as bodies are split.
["perfectionist::overly_long_function"]
max_lines = 97

# A ratchet: existing bodies nest deeper than this rule's default of
# three, the deepest at five levels. This ceiling sits at that depth so
# no new body may go deeper; lower it as they are flattened.
["perfectionist::excessive_nesting"]
max_depth = 5

# A ratchet: existing files are longer than this rule's default of 500
# lines, the longest -- the markdown scanner -- at 839. This ceiling
# sits at that length so no new file may go longer; lower it as they
# are split.
["perfectionist::overly_long_file"]
max_lines = 839
