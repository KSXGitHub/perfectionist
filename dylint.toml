[workspace.metadata.dylint]
libraries = [
  { path = "." },
]

# `import_grouping_mismatch` is inactive by default, so it must be enabled here
# for the self-lint to keep enforcing this crate's import layout.
#
# `arbitrary_source_item_ordering` is active by default and this crate does not
# yet satisfy it. Adopting the layout is a source change of its own, kept out of
# the commit that adds the rule so each reviews on its own terms; drop this entry
# in the same change that reorders the offending module bodies.
[perfectionist]
enable = ["import_grouping_mismatch"]
disable = ["arbitrary_source_item_ordering"]

["perfectionist::unicode_ellipsis_in_docs"]
scan_code_spans = true

# This crate keeps every module's `use` statements in one contiguous
# block with no blank lines between them, with `pub` re-exports pulled
# into two leading blocks — submodule re-exports above alias re-exports.
# Under `single_block` the `order` and group-classification knobs are
# ignored.
["perfectionist::import_grouping_mismatch"]
style = "single_block"
reexports = "split"

# `tools/gen-docs` parses `declare_tool_lint!` bodies with syn, whose
# `Token![::]` macro takes a token literal in type position — there is no
# runtime expression for the surrounding macro to drop or duplicate, so the
# exactly-once concern the rule guards against does not apply.
["perfectionist::impure_macro_arguments"]
ignore = ["Token"]
