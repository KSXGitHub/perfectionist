[workspace.metadata.dylint]
libraries = [
  { path = "." },
]

# `import_grouping_mismatch` is inactive by default, so it must be enabled here
# for the self-lint to keep enforcing this crate's import layout.
#
# `wildcard_imports` is active by default, but this workspace follows the
# conventional `#[cfg(test)] mod tests { use super::*; }` idiom in its unit
# tests (and a handful of in-module glob re-exports). That idiom is exactly
# what the rule flags, so dogfooding it here would mean rewriting every test
# module's imports against the grain of the convention; disable it for this
# crate's own self-lint instead.
[perfectionist]
enable = ["import_grouping_mismatch"]
disable = ["wildcard_imports"]

["perfectionist::unicode_ellipsis_in_docs"]
scan_code_spans = true

# This crate keeps every module's `use` statements in one contiguous
# block with no blank lines between them. Under `single_block` the
# `order`, `blank_line_count`, and group-classification knobs are ignored.
["perfectionist::import_grouping_mismatch"]
style = "single_block"

# `tools/gen-docs` parses `declare_tool_lint!` bodies with syn, whose
# `Token![::]` macro takes a token literal in type position — there is no
# runtime expression for the surrounding macro to drop or duplicate, so the
# exactly-once concern the rule guards against does not apply.
["perfectionist::impure_macro_argument"]
ignore = ["Token"]
